[project]
name = "civicflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "geoalchemy2>=0.15",
  "shapely>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "apscheduler>=3.10,<4",
  "pillow>=10.4",
  "piexif>=1.1",
  "imagehash>=4.3",
  "httpx>=0.27",
  "openai>=1.40",
  "anthropic>=0.34",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
